services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tasklist:tasklist@postgres:5432/tasklist
      TEST_DATABASE_URL: postgresql+psycopg://tasklist:tasklist@postgres:5432/tasklist_test
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tasklist
      POSTGRES_USER: tasklist
      POSTGRES_PASSWORD: tasklist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tasklist"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
